<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Feedback Form</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 40px 16px; }
  .card { max-width: 520px; margin: auto; background: #fff; padding: 28px 32px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  h1 { margin-top: 0; font-size: 1.5rem; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; color: #333; }
  input[type=text], input[type=email], textarea {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 110px; }
  .methods { margin-top: 16px; }
  .methods label { display: inline; font-weight: normal; margin-right: 16px; }
  button { margin-top: 22px; padding: 10px 24px; background: #1a73e8; color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #1558b0; }
  .note { font-size: .85rem; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>We value your feedback</h1>

  <form id="feedbackForm" action="feedback" method="post">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="feedback">Feedback</label>
    <textarea id="feedback" name="feedback" required></textarea>

    <div class="methods">
      <strong>Submit using:</strong><br>
      <label><input type="radio" name="method" value="post" checked> POST</label>
      <label><input type="radio" name="method" value="get"> GET</label>
      <div class="note">GET puts the data in the URL; POST sends it in the request body.</div>
    </div>

    <button type="submit">Submit Feedback</button>
  </form>
</div>

<script>
  // Switch the form's HTTP method based on the selected radio button
  document.querySelectorAll('input[name="method"]').forEach(function (r) {
    r.addEventListener('change', function () {
      document.getElementById('feedbackForm').method = this.value;
    });
  });
</script>
</body>
</html>
